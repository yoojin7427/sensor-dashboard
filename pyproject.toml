[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.streamlit]
pythonVersion = "3.9"

[project]
name = "sensor-dashboard"
version = "0.1.0"
description = "Sensor data analysis dashboard"
dependencies = [
    "streamlit==1.31.1",
    "pandas==2.2.0",
    "numpy==1.26.4",
    "scipy==1.12.0",
    "plotly==5.18.0",
    "pillow>=9.0.0,<11.0.0"
]